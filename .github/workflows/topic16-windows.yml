name: Topic 16 Windows CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: 行业智能体/金融/投资组合风控助手
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r integration/requirements.txt bandit==1.9.4
      - name: Record source revision and compile
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          $revision = Get-Content ../../../source-revision.json -Raw | ConvertFrom-Json
          $revision | Add-Member -NotePropertyName github_commit -NotePropertyValue $env:GITHUB_SHA
          $revision | ConvertTo-Json | Set-Content -Encoding utf8 .ci-results/source-revision.json
          python -m compileall -q app integration knowledge mcps portfolio_risk news_risk eval docs/delivery
      - name: Run project regressions
        run: python -B docs/delivery/ci.py --output .ci-results/unit
      - name: Scan for high severity findings
        if: ${{ !cancelled() }}
        run: |
          python -m bandit -r . --ignore-nosec --severity-level high -f json -o .ci-results/security.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; r=json.load(open('.ci-results/security.json')); assert not r['errors'] and not r['results']"
      - name: Archive reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: topic16-windows-${{ github.sha }}
          path: 行业智能体/金融/投资组合风控助手/.ci-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
